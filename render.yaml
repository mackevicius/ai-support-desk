services:
  - type: web
    name: ai-support-desk-api
    runtime: node
    plan: free
    branch: master
    buildCommand: npm ci
    startCommand: npm run start --workspace api
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_SESSION_SECRET
        generateValue: true
      - key: PYTHON_URL
        fromService:
          name: ai-support-desk-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_SERVICE_SECRET
        fromService:
          name: ai-support-desk-ai
          type: web
          envVarKey: AI_SERVICE_SECRET
  - type: web
    name: ai-support-desk-ai
    runtime: python
    plan: free
    branch: master
    buildCommand: python --version
    startCommand: python ai/server.py
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: '3.13.7'
      - key: AI_SERVICE_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
  - type: web
    name: ai-support-desk-web
    runtime: node
    plan: free
    branch: master
    buildCommand: npm ci && npm run build --workspace web
    startCommand: npm run start --workspace web -- --port $PORT
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: API_URL
        fromService:
          name: ai-support-desk-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_URL
        fromService:
          name: ai-support-desk-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
