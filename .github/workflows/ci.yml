name: Check public demo

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run prepare:embeddings --workspace api
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: python3 ai/evaluation.py --deterministic --output web/app/quality/results.json && git diff --exit-code -- web/app/quality/results.json ai/retrieval-results.json
      - run: npm test
      - run: npm run build --workspace web

  kubernetes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: azure/setup-kubectl@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: support-ci
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and load images
        run: |
          for service in web api ai; do
            docker build -f "$service/Dockerfile" -t "support-${service}:ci" .
            kind load docker-image "support-${service}:ci" --name support-ci
          done
      - name: Deploy and seed
        run: |
          postgres_password="$(openssl rand -hex 24)"
          kubectl create secret generic support-secrets \
            --from-literal=postgres-password="$postgres_password" \
            --from-literal=database-url="postgres://support:$postgres_password@db:5432/support_desk" \
            --from-literal=owner-password=test-password \
            --from-literal=owner-session-secret="$(openssl rand -hex 32)" \
            --from-literal=ai-service-secret="$(openssl rand -hex 32)"
          kubectl create configmap support-seed --from-file=seed.sql=api/seed.sql
          kubectl apply -f k8s/
          kubectl run fake-provider --image=support-api:ci --image-pull-policy=Never --port=8001 --env=PORT=8001 --command -- node --import tsx api/test/fake-provider.ts
          kubectl expose pod fake-provider --port=8001
          kubectl set env deployment/ai OPENAI_BASE_URL=http://fake-provider:8001 OPENAI_API_KEY=fake-key
          kubectl wait --for=condition=Ready pod/fake-provider --timeout=180s
          for service in db ai api web; do
            kubectl rollout status "deployment/$service" --timeout=180s
          done
      - name: Browser tests against Kubernetes
        run: |
          kubectl port-forward service/web 3100:3000 > /tmp/support-port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:3100/ > /dev/null
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:3100 npm test --workspace web
      - name: Print pod logs on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          for service in db ai api web; do
            kubectl logs "deployment/$service" --all-containers=true --tail=200 || true
          done