services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support_desk
      POSTGRES_USER: support
      POSTGRES_PASSWORD: local_only
    volumes:
      - support_data:/var/lib/postgresql/data
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U support -d support_desk']
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://support:local_only@db:5432/support_desk
      PORT: 3001
      PYTHON_URL: http://ai:8000
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-local-service-secret}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_SESSION_SECRET: ${OWNER_SESSION_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    ports:
      - '3001:3001'

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    environment:
      PORT: 8000
      AI_SERVICE_SECRET: ${AI_SERVICE_SECRET:-local-service-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_URL: http://api:3001
    volumes:
      - ./web/app/quality:/app/web/app/quality:ro
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  support_data:
