<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Support workspace prototype | Dayline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { font-family: "DM Sans", sans-serif; color: #212a28; background: #f6f8f6; font-synthesis: none; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, textarea, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 3px solid #207b70; outline-offset: 2px; }
    .mono { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .02em; }
    .shell { min-height: 100vh; padding-bottom: 95px; }
    .topbar { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(20px, 3vw, 46px); background: #fff; border-bottom: 1px solid #dde4de; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 700; white-space: nowrap; }
    .brandmark { width: 30px; height: 30px; display: grid; place-items: center; background: #16675d; color: white; font-size: 18px; border-radius: 5px; }
    .topnav { display: flex; align-items: center; gap: 24px; color: #62716c; font-size: 13px; font-weight: 600; }
    .topnav span:first-child { color: #16675d; }
    .account { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #e4e8df; color: #385045; font-size: 11px; font-weight: 700; flex: none; }
    .eyebrow { color: #6a7770; font-weight: 600; text-transform: uppercase; }
    .heading { margin: 0; font-size: clamp(22px, 2.2vw, 30px); line-height: 1.2; font-weight: 700; }
    .muted { color: #687770; }
    .divider { border-top: 1px solid #dce4dd; }
    .icon { width: 17px; height: 17px; stroke-width: 1.8; flex: none; }
    .btn { min-height: 38px; border: 1px solid #d4ded5; border-radius: 5px; background: white; color: #24302b; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 13px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .btn:hover { background: #edf3ed; }
    .btn.primary { color: white; background: #17695c; border-color: #17695c; }
    .btn.primary:hover { background: #10574c; }
    .btn.icon-only { width: 38px; padding: 0; }
    .pill { display: inline-flex; align-items: center; gap: 6px; background: #e8f2ee; color: #166553; border-radius: 4px; padding: 5px 8px; font-weight: 700; font-size: 11px; white-space: nowrap; }
    .pill.high { background: #fff0e4; color: #9a4b1e; }
    .pill.waiting { background: #eff0f1; color: #5e6668; }
    .list { display: flex; flex-direction: column; }
    .ticket { width: 100%; display: flex; gap: 12px; text-align: left; border: 0; border-bottom: 1px solid #e4eae3; background: transparent; padding: 16px; color: #26322b; }
    .ticket:hover { background: #f1f5f0; }
    .ticket.active { background: #e9f4ed; box-shadow: inset 3px 0 #21816b; }
    .ticket-main { flex: 1; min-width: 0; }
    .ticket-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 700; }
    .ticket-subject { display: block; font-size: 13px; line-height: 1.4; font-weight: 700; margin: 7px 0 5px; overflow-wrap: anywhere; }
    .ticket-preview { color: #6c7972; font-size: 12px; line-height: 1.45; margin: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .ticket-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
    .customer { display: flex; align-items: center; gap: 10px; }
    .customer strong { display: block; font-size: 13px; }
    .customer small { display: block; color: #697871; font-size: 11px; margin-top: 3px; }
    .request { padding: 20px 0 24px; font-size: 14px; line-height: 1.65; max-width: 70ch; }
    .request p { margin: 12px 0 0; }
    .section-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 12px; font-size: 13px; font-weight: 700; }
    .source { border-left: 2px solid #63a394; padding: 0 0 0 12px; margin: 14px 0; }
    .source strong { display: block; color: #146b5d; font-size: 12px; }
    .source p { margin: 5px 0 0; color: #596a61; font-size: 12px; line-height: 1.55; }
    .draft { width: 100%; min-height: 158px; resize: vertical; padding: 14px; border: 1px solid #d7e0d8; border-radius: 4px; background: #fff; color: #25342c; font-size: 13px; line-height: 1.65; }
    .draft-actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
    .note { font-size: 11px; color: #6f7c74; line-height: 1.5; }
    .note strong { color: #4d6054; }
    .suggestion { padding: 10px 12px; border-radius: 4px; background: #f0f4e8; color: #415c38; font-size: 12px; line-height: 1.5; }
    .suggestion strong { display: block; margin-bottom: 2px; }
    .switcher { position: fixed; z-index: 20; bottom: 16px; left: 50%; transform: translateX(-50%); width: min(390px, calc(100% - 24px)); background: #202d28; border-radius: 6px; box-shadow: 0 9px 35px #172f2b38; display: flex; align-items: center; justify-content: space-between; padding: 7px; gap: 8px; color: white; }
    .switcher button { width: 40px; height: 40px; border: 0; border-radius: 4px; color: white; background: #395149; display: grid; place-items: center; flex: none; }
    .switcher button:hover { background: #54756a; }
    .switcher-label { text-align: center; min-width: 0; }
    .switcher-label strong { display: block; font-size: 12px; }
    .switcher-label small { display: block; color: #b7cbc0; font-size: 10px; margin-top: 3px; }
    .toast { position: fixed; right: 20px; bottom: 80px; z-index: 21; max-width: min(340px, calc(100vw - 40px)); padding: 12px 16px; background: #202d28; color: white; border-radius: 4px; box-shadow: 0 6px 20px #142a242e; font-size: 12px; }
    .variant-a { display: grid; grid-template-columns: minmax(260px, 310px) minmax(0, 1fr); min-height: calc(100vh - 64px); }
    .a-sidebar { border-right: 1px solid #dce4dd; background: #fff; }
    .a-sidebar-head { padding: 25px 18px 18px; border-bottom: 1px solid #e4eae3; }
    .a-sidebar-head .heading { font-size: 21px; margin: 5px 0 14px; }
    .a-count { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; }
    .a-content { min-width: 0; background: #fff; }
    .a-detail-head { padding: 27px clamp(22px, 3vw, 42px) 23px; border-bottom: 1px solid #e4eae3; }
    .a-detail-head .heading { margin: 8px 0 13px; }
    .meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; }
    .a-body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); }
    .a-request { padding: 28px clamp(22px, 3vw, 42px); border-right: 1px solid #e4eae3; }
    .a-review { padding: 28px clamp(22px, 3vw, 42px); background: #f9fbf9; }
    .a-review .suggestion { margin-bottom: 25px; }
    .variant-b { max-width: 1290px; margin: 0 auto; padding: 36px clamp(20px, 4vw, 54px); }
    .b-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; padding-bottom: 26px; }
    .b-head .heading { margin-top: 7px; }
    .b-tabs { display: flex; border-bottom: 1px solid #d5ded4; gap: 25px; margin-bottom: 20px; }
    .b-tabs span { font-size: 12px; font-weight: 700; padding: 11px 0; color: #778279; }
    .b-tabs .selected { color: #146b5d; box-shadow: inset 0 -2px #207866; }
    .b-list { background: white; border: 1px solid #dce4dd; border-radius: 5px; overflow: hidden; }
    .b-row { width: 100%; min-height: 84px; padding: 14px 20px; border: 0; border-bottom: 1px solid #e5ebe4; background: white; display: grid; align-items: center; grid-template-columns: 38px minmax(0, 1fr) minmax(95px, .3fr) 75px 20px; gap: 14px; text-align: left; color: #26322b; }
    .b-row:last-child { border-bottom: 0; }
    .b-row:hover { background: #f3f8f4; }
    .b-row strong { display: block; font-size: 13px; overflow-wrap: anywhere; }
    .b-row small { display: block; margin-top: 5px; font-size: 11px; color: #758179; }
    .b-detail { background: white; min-height: calc(100vh - 64px); }
    .b-detail-top { padding: 28px clamp(20px, 6vw, 90px); border-bottom: 1px solid #dce4dd; }
    .b-detail-top .heading { margin: 18px 0 12px; }
    .b-detail-body { max-width: 1050px; margin: auto; padding: 35px 30px 70px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, .85fr); gap: clamp(30px, 5vw, 75px); }
    .b-draft { border-top: 1px solid #dce4dd; padding-top: 26px; margin-top: 26px; }
    .b-evidence { border-left: 1px solid #dce4dd; padding-left: 30px; }
    .variant-c { max-width: 1550px; margin: 0 auto; padding: 24px clamp(20px, 2.5vw, 40px); }
    .c-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 21px; }
    .c-head .heading { margin-top: 5px; }
    .c-grid { display: grid; grid-template-columns: minmax(220px, .7fr) minmax(0, 1.2fr) minmax(0, 1fr); min-height: 640px; border: 1px solid #dce4dd; background: white; border-radius: 5px; overflow: hidden; }
    .c-column { min-width: 0; padding: 22px; border-right: 1px solid #dce4dd; }
    .c-column:last-child { border-right: 0; background: #fcfdfb; }
    .c-column:first-child { padding: 0; }
    .c-column .ticket { padding: 17px; }
    .c-title { display: flex; justify-content: space-between; align-items: center; min-height: 59px; padding: 0 17px; border-bottom: 1px solid #e4eae3; font-weight: 700; font-size: 12px; }
    .c-ticket-title { margin: 16px 0 14px; font-size: 20px; line-height: 1.25; }
    .c-evidence { padding: 19px 0; margin-top: 12px; border-top: 1px solid #dce4dd; }
    .c-column .draft { min-height: 220px; }
    @media (max-width: 1100px) {
      .a-body { grid-template-columns: 1fr; }
      .a-request { border-right: 0; border-bottom: 1px solid #e4eae3; }
      .c-grid { grid-template-columns: 215px minmax(0, 1fr); }
      .c-column:last-child { grid-column: 2; border-top: 1px solid #dce4dd; }
    }
    @media (max-width: 720px) {
      .topbar { height: 56px; }
      .topnav, .account span { display: none; }
      .variant-a { display: block; }
      .a-sidebar { border-right: 0; }
      .a-sidebar .list { display: flex; flex-direction: row; overflow-x: auto; }
      .a-sidebar .ticket { flex: 0 0 220px; border-right: 1px solid #e4eae3; }
      .a-detail-head { padding: 23px 20px; }
      .a-request, .a-review { padding: 23px 20px; }
      .b-head, .c-head { align-items: start; }
      .b-row { grid-template-columns: 30px minmax(0, 1fr) 20px; }
      .b-row .pill, .b-row .mono { display: none; }
      .b-detail-body { display: block; padding: 24px 20px 60px; }
      .b-detail-top { padding: 24px 20px; }
      .b-evidence { border-left: 0; border-top: 1px solid #dce4dd; padding: 22px 0 0; margin-top: 30px; }
      .c-grid { display: block; }
      .c-column { border-right: 0; border-bottom: 1px solid #dce4dd; }
      .c-column:first-child .list { display: flex; overflow-x: auto; }
      .c-column:first-child .ticket { flex: 0 0 220px; }
      .c-column:last-child { border: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brandmark">d.</span> Dayline <span class="muted" style="font-weight: 400">/ Support</span></div>
      <nav class="topnav" aria-label="Workspace"><span>Inbox</span><span>Knowledge</span><span>Quality</span></nav>
      <div class="account"><span>Demo workspace</span><span class="avatar">PM</span></div>
    </header>
    <main id="app"></main>
  </div>
  <div class="switcher" aria-label="Prototype variants">
    <button id="previous" aria-label="Previous layout" title="Previous layout"><i data-lucide="arrow-left" class="icon"></i></button>
    <span class="switcher-label" id="variant-label"></span>
    <button id="next" aria-label="Next layout" title="Next layout"><i data-lucide="arrow-right" class="icon"></i></button>
  </div>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script>
    // Prototype only: three layouts for the same support workflow; all state stays in memory.
    const tickets = [
      { id: "DL-2048", name: "Maya Chen", initials: "MC", subject: "Invoice exports are missing March", preview: "The CSV export only contains February, but I can see March invoices in the billing page.", time: "4 min", priority: "High", status: "Open", question: "Hi team, I'm preparing our monthly reconciliation. When I export invoices as CSV, the file only includes February, even though I can see all our March invoices in the billing page. Is there a filter I'm missing? I need this for our finance review today." },
      { id: "DL-2047", name: "Oliver Reed", initials: "OR", subject: "Can our team use SSO?", preview: "We're moving to Okta next month and need to know which plan includes SAML.", time: "18 min", priority: "Normal", status: "Open", question: "We're moving to Okta next month. Does Dayline support SAML SSO and what plan would we need?" },
      { id: "DL-2046", name: "Nadia Ali", initials: "NA", subject: "Invite link expired", preview: "Our new colleague couldn't join the workspace using the invitation from yesterday.", time: "1 hr", priority: "Normal", status: "Waiting", question: "The invite link we sent yesterday says it has expired. Can we resend it?" },
      { id: "DL-2045", name: "Theo Martin", initials: "TM", subject: "Change a workspace owner", preview: "We're handing over administration to another team member at the end of the week.", time: "2 hrs", priority: "Normal", status: "Open", question: "How do I change the owner of our workspace?" }
    ];
    const knowledge = {
      "DL-2048": {
        draft: "Hi Maya, your export is likely using the default date range, which includes only the last completed billing period. In Billing > Invoices, choose a custom date range that includes March, then export the CSV again. If March is still missing, please let us know the dates you selected and we'll investigate.\n\nSources: Exporting invoices; Billing permissions",
        sources: [
          { title: "Exporting invoices", excerpt: "The invoice export defaults to the last completed billing period. Choose a custom date range to include invoices from the current month." },
          { title: "Billing permissions", excerpt: "Workspace admins and billing managers can export invoice CSV files from Billing > Invoices." }
        ]
      },
      "DL-2047": {
        draft: "Hi Oliver, Dayline supports SAML SSO on the Business plan. An admin can connect Okta from Settings > Authentication. If you'd like, we can help plan the switch before your team moves next month.\n\nSources: Single sign-on; Business plan features",
        sources: [
          { title: "Single sign-on", excerpt: "Workspace admins can set up SAML SSO with Okta under Settings > Authentication." },
          { title: "Business plan features", excerpt: "SAML SSO is available on the Business plan." }
        ]
      },
      "DL-2046": {
        draft: "Hi Nadia, invitation links expire after 24 hours. A workspace admin can send a new invitation from Settings > Members. The old link won't work after the new one is sent.\n\nSources: Inviting members; Invitation expiry",
        sources: [
          { title: "Inviting members", excerpt: "Workspace admins can invite or reinvite teammates from Settings > Members." },
          { title: "Invitation expiry", excerpt: "Invitation links expire 24 hours after they are sent." }
        ]
      },
      "DL-2045": {
        draft: "Hi Theo, a workspace owner can transfer ownership from Settings > Members by selecting another active member. The new owner must accept the transfer before it takes effect.\n\nSources: Transferring ownership; Workspace roles",
        sources: [
          { title: "Transferring ownership", excerpt: "The current owner can propose a transfer in Settings > Members; the recipient must accept it." },
          { title: "Workspace roles", excerpt: "Each workspace has one owner, who can manage billing and roles." }
        ]
      }
    };
    const names = { A: "Split inbox", B: "Queue then focus", C: "Review workspace" };
    const params = new URLSearchParams(location.search);
    let variant = names[params.get("variant")] ? params.get("variant") : "A";
    let selected = 0;
    let detailOpen = false;
    const activeCount = () => tickets.filter((ticket) => ticket.status !== "Resolved").length;

    const icon = (name) => `<i data-lucide="${name}" class="icon" aria-hidden="true"></i>`;
    const current = () => tickets[selected];
    const priority = () => current().priority === "High" ? "pill high" : "pill";
    const escapeHtml = (value) => value.replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    const ticketButton = (ticket, index) => `<button class="ticket ${selected === index ? "active" : ""}" data-select="${index}" aria-label="Open ${escapeHtml(ticket.subject)}"><span class="avatar">${ticket.initials}</span><span class="ticket-main"><span class="ticket-top">${escapeHtml(ticket.name)} <span class="muted mono">${ticket.time}</span></span><span class="ticket-subject">${escapeHtml(ticket.subject)}</span><span class="ticket-preview">${escapeHtml(ticket.preview)}</span><span class="ticket-bottom"><span class="mono muted">${ticket.id}</span><span class="${ticket.priority === "High" ? "pill high" : "pill waiting"}">${ticket.priority}</span></span></span></button>`;
    const customer = () => `<div class="customer"><span class="avatar">${current().initials}</span><span><strong>${escapeHtml(current().name)}</strong><small>Customer &middot; ${current().time} ago</small></span></div>`;
    const request = () => `<div class="request"><div class="section-label">Customer request <span class="mono muted">${current().id}</span></div>${customer()}<p>${escapeHtml(current().question)}</p></div>`;
    const evidence = () => `<div class="section-label">${icon("book-open")} Sources used <span class="mono muted">${knowledge[current().id].sources.length} documents</span></div>${knowledge[current().id].sources.map((source) => `<div class="source"><strong>${escapeHtml(source.title)}</strong><p>${escapeHtml(source.excerpt)}</p></div>`).join("")}`;
    const editor = () => `<div class="section-label">${icon("sparkles")} Suggested reply <span class="pill">Saved AI result</span></div><textarea class="draft" aria-label="Edit suggested reply">${escapeHtml(knowledge[current().id].draft)}</textarea><div class="draft-actions"><span class="note"><strong>Human review required.</strong><br>Nothing is sent automatically.</span><button class="btn primary" data-approve ${current().status === "Resolved" ? "disabled" : ""}>${icon("check")} ${current().status === "Resolved" ? "Approved" : "Approve reply"}</button></div>`;
    const suggestion = () => `<div class="suggestion"><strong>Suggested priority: ${current().priority}</strong>${current().priority === "High" ? "Customer needs invoice data for a finance review today." : "No immediate deadline indicated in the request."}</div>`;

    function variantA() {
      return `<div class="variant-a"><aside class="a-sidebar"><div class="a-sidebar-head"><div class="mono eyebrow">Workspace / 01</div><h1 class="heading">Inbox</h1><div class="a-count"><span>Needs attention</span><span class="pill">${activeCount()} active</span></div></div><div class="list">${tickets.map(ticketButton).join("")}</div></aside><div class="a-content"><div class="a-detail-head"><div class="mono eyebrow">${current().id} / ${current().status}</div><h2 class="heading">${escapeHtml(current().subject)}</h2><div class="meta-row"><span class="${priority()}">${current().priority} priority</span><span class="mono muted">Received ${current().time} ago</span></div></div><div class="a-body"><section class="a-request">${request()}<div class="divider" style="padding-top: 24px">${evidence()}</div></section><section class="a-review">${suggestion()}${editor()}</section></div></div></div>`;
    }
    function variantB() {
      if (detailOpen) return `<div class="b-detail"><div class="b-detail-top"><button class="btn" data-back>${icon("arrow-left")} Back to inbox</button><div class="mono eyebrow" style="margin-top: 28px">${current().id} / ${current().status}</div><h1 class="heading">${escapeHtml(current().subject)}</h1><div class="meta-row">${customer()}<span class="${priority()}">${current().priority} priority</span></div></div><div class="b-detail-body"><section>${request()}<div class="b-draft">${suggestion()}<div style="margin-top: 24px">${editor()}</div></div></section><aside class="b-evidence">${evidence()}</aside></div></div>`;
      return `<div class="variant-b"><div class="b-head"><div><div class="mono eyebrow">Workspace / 01</div><h1 class="heading">Support inbox</h1><p class="muted" style="font-size: 13px; margin: 9px 0 0">Requests awaiting a human decision</p></div><span class="pill">${activeCount()} active</span></div><div class="b-tabs"><span class="selected">Needs attention</span><span>Waiting</span><span>Resolved</span></div><div class="b-list">${tickets.map((ticket, index) => `<button class="b-row" data-select="${index}"><span class="avatar">${ticket.initials}</span><span><strong>${escapeHtml(ticket.subject)}</strong><small>${escapeHtml(ticket.name)} &middot; ${escapeHtml(ticket.preview)}</small></span><span class="${ticket.priority === "High" ? "pill high" : "pill waiting"}">${ticket.priority}</span><span class="mono muted">${ticket.time}</span>${icon("chevron-right")}</button>`).join("")}</div></div>`;
    }
    function variantC() {
      return `<div class="variant-c"><div class="c-head"><div><div class="mono eyebrow">Dayline / Support operations</div><h1 class="heading">Review workspace</h1></div><span class="pill">${activeCount()} active</span></div><div class="c-grid"><aside class="c-column"><div class="c-title"><span>Queue</span><span class="mono muted">${activeCount()} active</span></div><div class="list">${tickets.map(ticketButton).join("")}</div></aside><section class="c-column"><div class="mono eyebrow">${current().id} / ${current().status}</div><h2 class="c-ticket-title">${escapeHtml(current().subject)}</h2><div class="meta-row">${customer()}<span class="${priority()}">${current().priority}</span></div>${request()}<div class="c-evidence">${evidence()}</div></section><section class="c-column">${suggestion()}<div style="margin-top: 24px">${editor()}</div></section></div></div>`;
    }

    function render() {
      document.getElementById("app").innerHTML = ({ A: variantA, B: variantB, C: variantC })[variant]();
      document.getElementById("variant-label").innerHTML = `<strong>${variant} &middot; ${names[variant]}</strong><small>UI prototype / ${current().id} / ${current().status}</small>`;
      document.querySelectorAll("[data-select]").forEach((button) => button.addEventListener("click", () => { selected = Number(button.dataset.select); detailOpen = variant === "B"; render(); }));
      document.querySelector("[data-back]")?.addEventListener("click", () => { detailOpen = false; render(); });
      document.querySelector("[data-approve]")?.addEventListener("click", () => { current().status = "Resolved"; render(); const toast = document.createElement("div"); toast.className = "toast"; toast.setAttribute("role", "status"); toast.textContent = "Reply approved in this prototype. No message was sent."; document.body.append(toast); setTimeout(() => toast.remove(), 3500); });
      document.querySelector(".draft")?.addEventListener("input", (event) => { knowledge[current().id].draft = event.target.value; });
      if (window.lucide) lucide.createIcons();
    }

    function changeVariant(offset) {
      const keys = Object.keys(names);
      variant = keys[(keys.indexOf(variant) + offset + keys.length) % keys.length];
      detailOpen = false;
      const url = new URL(location.href);
      url.searchParams.set("variant", variant);
      history.replaceState(null, "", url);
      render();
    }
    document.getElementById("previous").addEventListener("click", () => changeVariant(-1));
    document.getElementById("next").addEventListener("click", () => changeVariant(1));
    document.addEventListener("keydown", (event) => {
      if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
      if (event.key === "ArrowLeft") changeVariant(-1);
      if (event.key === "ArrowRight") changeVariant(1);
    });
    window.addEventListener("popstate", () => { variant = names[new URLSearchParams(location.search).get("variant")] ? new URLSearchParams(location.search).get("variant") : "A"; detailOpen = false; render(); });
    render();
  </script>
</body>
</html>
